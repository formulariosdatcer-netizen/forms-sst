<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E87722">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Formularios SST | DATCER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="app-header">
    <img src="icons/logo.png" class="header-logo-img" alt="DATCER">
    <span class="header-title">Formularios SST</span>
    <a href="admin.html" class="header-admin-btn">Panel</a>
  </header>

  <div class="offline-banner" id="offline-banner">
    📵 Sin conexión — los formularios se guardarán localmente
  </div>
  <div class="sync-banner" id="sync-banner"></div>

  <div class="container">

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-num" id="stat-forms">0</div>
        <div class="stat-label">Formularios</div>
      </div>
      <div class="stat-card" id="stat-pending-card" style="display:none">
        <div class="stat-num" id="stat-pending" style="color:var(--brand)">0</div>
        <div class="stat-label">Por sincronizar</div>
      </div>
    </div>

    <input type="search" class="search-box" id="search"
           placeholder="🔍 Buscar formulario..." autocomplete="off">

    <div class="forms-grid" id="forms-grid">
      <div class="empty-state">
        <div class="empty-state-icon">📋</div>
        <div class="empty-state-text">Cargando formularios...</div>
      </div>
    </div>

  </div>

  <!-- Config (Supabase credentials) -->
  <script src="js/config.js"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- DB abstraction -->
  <script src="js/db.js"></script>
  <!-- Form definitions -->
  <script src="js/forms/fr-sst-36.js"></script>
  <script src="js/forms/fr-sst-37.js"></script>
  <script src="js/forms/fr-sst-38.js"></script>
  <script src="js/forms/fr-sst-39.js"></script>
  <script src="js/forms/fr-sst-40.js"></script>
  <script src="js/forms/fr-sst-41.js"></script>
  <script src="js/forms/fr-sst-42.js"></script>
  <script src="js/forms/fr-sst-43.js"></script>
  <script src="js/forms/fr-sst-44.js"></script>
  <script src="js/forms/fr-sst-45.js"></script>
  <script src="js/forms/fr-sst-46.js"></script>
  <script src="js/forms/fr-sst-47.js"></script>
  <script src="js/forms/fr-sst-48.js"></script>
  <script src="js/forms/fr-sst-49.js"></script>
  <script src="js/forms/fr-sst-50.js"></script>
  <script src="js/forms/fr-sst-51.js"></script>
  <script src="js/forms/fr-sst-52.js"></script>
  <script src="js/forms/fr-sst-53.js"></script>
  <script src="js/forms/fr-sst-54.js"></script>
  <script src="js/forms/fr-sst-55.js"></script>
  <script src="js/forms/fr-sst-56.js"></script>
  <!-- Page logic -->
  <script src="js/index.js"></script>

</body>
</html>
